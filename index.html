<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Recommendation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
        }

        .option-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #f5f5f5;
        }

        .option-btn:hover {
            background: #e9e9e9;
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 8px;
            display: none;
        }

        .amex {
            background-color: #e6f4ff;
            color: #006fcf;
        }

        .sas {
            background-color: #fff4e5;
            color: #b56a00;
        }
    </style>
</head>
<body>

    <h1>Which Card Should I Use?</h1>

    <button class="option-btn" onclick="recommendCard('nok')">
        NOK Purchase
    </button>

    <button class="option-btn" onclick="recommendCard('foreign')">
        Foreign Currency Purchase
    </button>

    <button class="option-btn" onclick="recommendCard('sas')">
        SAS Tickets
    </button>

    <div id="result"></div>

    <script>
        // ================================
        // CONFIGURATION
        // ================================

        const doublePointDates = [
            //"2026-08-06",
            //"2026-09-15"
        ];

        const amexReached = false;

        // ================================
        // LOGIC
        // ================================

        function getNorwegianDate() {
            const now = new Date();

            return new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Europe/Oslo',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).format(now);
        }

        function isDoublePointDate() {
            const today = getNorwegianDate();
            return doublePointDates.includes(today);
        }

        function recommendCard(type) {
            let result;

            if (type === 'sas') {
                result = 'SAS Mastercard';
            } 
            else if (type === 'nok') {
                result = isDoublePointDate()
                    ? 'SAS Mastercard'
                    : 'AMEX';
            } 
            else if (type === 'foreign') {
                if (isDoublePointDate()) {
                    result = 'SAS Mastercard';
                } else if (amexReached) {
                    result = 'SAS Mastercard';
                } else {
                    result = 'AMEX';
                }
            }

            showResult(result);
        }

        function showResult(card) {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = card;

            resultDiv.className = '';
            resultDiv.classList.add(
                card === 'AMEX' ? 'amex' : 'sas'
            );

            resultDiv.style.display = 'block';
        }
    </script>

</body>
</html>
