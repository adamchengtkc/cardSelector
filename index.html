<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Which Card Should I Use?</title>

<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 20px;
        background: #f5f7fa;
    }

    h1 {
        text-align: center;
    }

    .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
    }

    .option-btn {
        display: block;
        width: 100%;
        padding: 16px;
        margin-bottom: 12px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #0078d4;
        color: white;
    }

    .option-btn:hover {
        background: #106ebe;
    }

    #result {
        display: none;
        margin-top: 25px;
        padding: 20px;
        border-radius: 8px;
        text-align: center;
    }

    .amex {
        background: #e8f4ff;
        color: #006fcf;
    }

    .sas {
        background: #fff4e5;
        color: #b56a00;
    }

    #cardName {
        font-size: 2rem;
        font-weight: bold;
    }

    #reason {
        margin-top: 10px;
    }

    .period-section {
        margin-top: 24px;
        background: white;
        padding: 16px;
        border-radius: 8px;
    }

    .period-section h3 {
        margin-top: 0;
    }

    ul {
        margin-bottom: 0;
    }
</style>
</head>
<body>

<h1>Which Card Should I Use?</h1>
<div class="subtitle">Select your purchase type</div>

<button class="option-btn" onclick="recommendCard('nok')">
    NOK Purchase
</button>

<button class="option-btn" onclick="recommendCard('foreign')">
    Foreign Currency Purchase
</button>

<button class="option-btn" onclick="recommendCard('sas')">
    SAS Tickets
</button>

<div id="result">
    <div id="cardName"></div>
    <div id="reason"></div>
</div>

<div class="period-section">
    <h3>Upcoming double points dates</h3>
    <ul id="generalPeriods"></ul>
</div>

<div class="period-section">
    <h3>Upcoming foreign currency double points dates</h3>
    <ul id="foreignPeriods"></ul>
</div>

<div class="period-section">
    <h3>Upcoming SAS.no double points dates</h3>
    <ul id="sasPeriods"></ul>
</div>

<script>

//
// CONFIGURATION
//

const doublePointPeriods = [
//    {
//        start: "2026-08-01",
//        end: "2026-08-10"
//    },
//    {
//        start: "2026-12-01",
//        end: "2026-12-05"
//    }
];

const doublePointPeriodsForeign = [
//    {
//        start: "2026-09-01",
//        end: "2026-09-10"
//    }
];

const doublePointPeriodsSAS = [
//    {
//        start: "2026-10-01",
//        end: "2026-10-05"
//    }
];

const amexReached = false;

//
// DATE FUNCTIONS
//

function getNorwegianDate() {
    return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/Oslo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    }).format(new Date());
}

function isWithinPeriods(periods) {
    const today = getNorwegianDate();

    return periods.some(period =>
        today >= period.start &&
        today <= period.end
    );
}

//
// CARD RECOMMENDATION LOGIC
//

function recommendCard(type) {

    let card;
    let reason;

    if (type === "nok") {

        if (isWithinPeriods(doublePointPeriods)) {
            card = "SAS Mastercard";
            reason = "Active double-points period.";
        } else {
            card = "AMEX";
            reason = "No active double-points period.";
        }

    } else if (type === "foreign") {

        const active =
            isWithinPeriods(doublePointPeriods) ||
            isWithinPeriods(doublePointPeriodsForeign);

        if (active) {
            card = "SAS Mastercard";
            reason = "Active double-points promotion.";
        } else if (amexReached) {
            card = "SAS Mastercard";
            reason = "AMEX target already reached.";
        } else {
            card = "AMEX";
            reason = "No active promotion and AMEX target not reached.";
        }

    } else if (type === "sas") {

        card = "SAS Mastercard";

        const active =
            isWithinPeriods(doublePointPeriods) ||
            isWithinPeriods(doublePointPeriodsSAS);

        reason = active
            ? "Active SAS double-points promotion."
            : "SAS tickets should always use SAS Mastercard.";
    }

    showResult(card, reason);
}

//
// UI
//

function showResult(card, reason) {

    const result = document.getElementById("result");

    document.getElementById("cardName").textContent = card;
    document.getElementById("reason").textContent = reason;

    result.className = "";

    if (card === "AMEX") {
        result.classList.add("amex");
    } else {
        result.classList.add("sas");
    }

    result.style.display = "block";
}

//
// PROMOTION LISTS
//

function renderPeriods() {

    renderPeriodList(
        "generalPeriods",
        doublePointPeriods
    );

    renderPeriodList(
        "foreignPeriods",
        doublePointPeriodsForeign
    );

    renderPeriodList(
        "sasPeriods",
        doublePointPeriodsSAS
    );
}

function renderPeriodList(elementId, periods) {

    const list = document.getElementById(elementId);
    list.innerHTML = "";

    const today = getNorwegianDate();

    const upcomingPeriods = periods
        .filter(period => period.end >= today)
        .map(period => ({
            start: period.start < today ? today : period.start,
            end: period.end
        }))
        .sort((a, b) => a.start.localeCompare(b.start));

    if (upcomingPeriods.length === 0) {
        list.innerHTML = "<li>No upcoming promotions</li>";
        return;
    }

    upcomingPeriods.forEach(period => {
        const li = document.createElement("li");
        li.textContent = `${period.start} → ${period.end}`;
        list.appendChild(li);
    });
}

renderPeriods();

</script>

</body>
</html>
